<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATAWARU - Pelepasan Siswa Kelas 9</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond (Scrapbook Serif) & Plus Jakarta Sans (Clean Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --font-serif: 'Cormorant Garamond', serif;
            --font-display: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --paper-color: #FAF6EE;
            --ink-dark: #2C2A29;
            --accent-terracotta: #E6A18D;
            --accent-peach: #F3D1C1;
            --accent-mustard: #D4A373;
            --accent-olive: #E9D8A6;
            --accent-sage: #A3B19B;
            --accent-mint: #CCD5AE;
            --accent-sky: #90E0EF;
            --accent-periwinkle: #A8DADC;
            --accent-lilac: #BDB2FF;
            --accent-gold: #FFD166;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0d0d11;
            color: var(--ink-dark);
            overflow-x: hidden;
        }

        .font-serif-journal {
            font-family: var(--font-serif);
        }

        .font-display-journal {
            font-family: var(--font-display);
        }

        /* Tekstur Kertas Scrapbook */
        .paper-texture {
            background-color: var(--paper-color);
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.05);
        }

        /* Foto Siswa Tanpa Frame */
        .photo-wrap {
            position: relative;
            width: 300px;
            height: 390px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(20, 20, 24, 0.9), rgba(36, 36, 42, 0.85));
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.22), 0 8px 18px rgba(0, 0, 0, 0.15);
            animation: photoFloat 6.5s ease-in-out infinite;
        }

        .photo-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0.08) 35%, rgba(0,0,0,0));
            pointer-events: none;
            z-index: 2;
        }

        .photo-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 22%, rgba(255, 255, 255, 0.3) 50%, transparent 78%);
            transform: translateX(-120%);
            animation: photoShimmer 7s linear infinite;
            pointer-events: none;
            z-index: 3;
        }

        .photo-backdrop {
            position: absolute;
            inset: -14px;
            border-radius: 36px;
            filter: blur(16px);
            opacity: 0.38;
            z-index: 0;
            animation: backdropPulse 8s ease-in-out infinite;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: photoZoom 14s ease-in-out infinite alternate;
            transform-origin: center center;
        }

        .photo-tag {
            position: absolute;
            left: 14px;
            bottom: 12px;
            z-index: 4;
            color: rgba(255,255,255,0.92);
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
        }

        /* Efek Plester / Tape Scrapbook */
        .washi-tape {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            border-left: 3px dashed rgba(0, 0, 0, 0.05);
            border-right: 3px dashed rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transform: rotate(-4deg);
        }

        /* Transisi Slide Halus */
        .slide-fade-enter {
            opacity: 0;
            transform: translateY(16px) scale(0.987);
            filter: blur(3px);
        }

        .slide-fade-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
            transition: opacity 0.65s cubic-bezier(0.25, 1, 0.5, 1), transform 0.65s cubic-bezier(0.25, 1, 0.5, 1), filter 0.65s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-motion {
            animation: slideBreath 11s ease-in-out infinite;
        }

        /* Desain Scrollbar Tersembunyi */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Grid Animasi Rasi Bintang */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px var(--glow-color)); }
        }

        @keyframes photoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes photoZoom {
            0% { transform: scale(1.02) translateX(-0.8%); }
            100% { transform: scale(1.07) translateX(0.8%); }
        }

        @keyframes photoShimmer {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(120%); }
        }

        @keyframes backdropPulse {
            0%, 100% { opacity: 0.33; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.04); }
        }

        @keyframes slideBreath {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        @keyframes ornamentDrift {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(0, -10px, 0) scale(1.06); }
        }

        @keyframes contentRise {
            0% { opacity: 0; transform: translateY(24px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 1px 0 rgba(0,0,0,0.06); }
            50% { text-shadow: 0 8px 22px rgba(0,0,0,0.14); }
        }

        @keyframes missionCardEnter {
            0% { opacity: 0; transform: translateY(26px) rotateX(8deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        @keyframes networkThumbFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-8px); }
        }

        @keyframes networkLinePulse {
            0%, 100% { stroke-opacity: 0.16; }
            50% { stroke-opacity: 0.38; }
        }

        @keyframes outroGlow {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.62; transform: scale(1.08); }
        }

        @keyframes universalSlideItemIn {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.985);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .ornament-float {
            animation: ornamentDrift 8s ease-in-out infinite;
        }

        .content-rise {
            animation: contentRise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .title-pulse {
            animation: titlePulse 6s ease-in-out infinite;
        }

        .mission-card-pop {
            animation: missionCardEnter 0.75s cubic-bezier(0.18, 0.8, 0.3, 1) both;
        }

        .network-link-line {
            animation: networkLinePulse 4.2s ease-in-out infinite;
        }

        .network-thumb {
            position: absolute;
            width: 88px;
            height: 88px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 14px 26px rgba(0,0,0,0.25);
            opacity: 0.24;
            filter: saturate(0.95);
            animation: networkThumbFloat 7s ease-in-out infinite;
        }

        .network-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .outro-glow {
            animation: outroGlow 9s ease-in-out infinite;
        }

        .slide-item-enter {
            opacity: 0;
            animation: universalSlideItemIn 0.72s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: var(--enter-delay, 0s);
            will-change: transform, opacity, filter;
        }

        .rank-badge-scrapbook {
            position: absolute;
            left: 50%;
            bottom: -12px;
            transform: translateX(-50%) rotate(var(--badge-rotation, -1.5deg));
            z-index: 12;
            min-width: 216px;
            padding: 14px 20px 16px;
            border-radius: 18px;
            border: 1px solid var(--badge-border, rgba(84, 66, 48, 0.18));
            background:
                linear-gradient(180deg, rgba(255,255,255,0.94), var(--badge-tint, rgba(243,235,223,0.97))),
                radial-gradient(rgba(44,42,41,0.04) 1px, transparent 0),
                linear-gradient(90deg, transparent 0 4%, rgba(255,255,255,0.26) 16%, transparent 32%, rgba(44,42,41,0.025) 52%, transparent 72%, rgba(255,255,255,0.2) 88%, transparent 100%);
            background-size: auto, 14px 14px, 100% 100%;
            box-shadow: 0 14px 28px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.58);
            backdrop-filter: blur(2px);
            text-align: center;
        }

        .rank-badge-scrapbook::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 13px;
            border: 1px dashed rgba(44,42,41,0.12);
            pointer-events: none;
        }

        .rank-badge-scrapbook::after {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            width: 74px;
            height: 20px;
            transform: translateX(-50%) rotate(var(--badge-tape-rotation, -3deg));
            border-left: 2px dashed rgba(44,42,41,0.08);
            border-right: 2px dashed rgba(44,42,41,0.08);
            background: linear-gradient(180deg, rgba(255,255,255,0.58), rgba(238,230,214,0.4));
            opacity: 0.95;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            pointer-events: none;
        }

        .rank-badge-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .rank-badge-label {
            display: block;
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(44,42,41,0.58);
            line-height: 1;
        }

        .rank-badge-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 42px;
            line-height: 1;
            font-weight: 900;
            color: rgba(44,42,41,0.94);
            letter-spacing: 0.04em;
        }

        .rank-badge-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.45);
            flex-shrink: 0;
        }

        .rank-badge-readable {
            min-width: 258px;
            bottom: -10px;
            padding: 16px 22px 18px;
        }

        .rank-badge-readable .rank-badge-label {
            font-size: 16px;
        }

        .rank-badge-readable .rank-badge-number {
            font-size: 52px;
        }

        @keyframes suspenseSweep {
            0% { transform: translateX(-130%) rotate(-12deg); opacity: 0; }
            20% { opacity: 0.22; }
            65% { opacity: 0.38; }
            100% { transform: translateX(135%) rotate(-12deg); opacity: 0; }
        }

        @keyframes celebratePop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.28; }
            50% { transform: translateY(-12px) scale(1.15); opacity: 0.65; }
        }

        @keyframes introSceneInOut {
            0% { opacity: 0; transform: translateY(20px) scale(0.985); }
            9% { opacity: 1; transform: translateY(0) scale(1); }
            91% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes introBeamSweep {
            0%, 100% { opacity: 0.16; transform: translateY(0) skewY(-7deg); }
            50% { opacity: 0.34; transform: translateY(-16px) skewY(-7deg); }
        }

        @keyframes introRingPulse {
            0% { transform: translate(-50%, -50%) scale(0.55); opacity: 0; }
            18% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.26; }
            55% { transform: translate(-50%, -50%) scale(1.22); opacity: 0.14; }
            100% { transform: translate(-50%, -50%) scale(1.42); opacity: 0; }
        }

        @keyframes introRankCenterToTop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            13% { opacity: 1; transform: translate(-50%, -50%) scale(1.32); }
            36% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
            58% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            74% { opacity: 1; transform: translate(-50%, -44vh) scale(0.52); }
            100% { opacity: 0; transform: translate(-50%, -44vh) scale(0.52); }
        }

        @keyframes introTopRankReveal {
            0%, 62% { opacity: 0; transform: translate(-50%, -18px) scale(0.82); }
            80%, 100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        @keyframes introPhotoReveal {
            0%, 62% { opacity: 0; transform: translateX(-96px) scale(0.9) rotate(-2deg); filter: blur(4px); }
            80%, 100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); filter: blur(0); }
        }

        @keyframes introNameHeroReveal {
            0%, 72% { opacity: 0; transform: translateX(78px) scale(0.95); filter: blur(6px); }
            88%, 100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }

        @keyframes introSparkOrbit {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.28; }
            50% { transform: translateY(-16px) scale(1.2); opacity: 0.6; }
        }

        .student-intro-stage {
            --intro-accent: #ffd166;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            animation: introSceneInOut 7.4s cubic-bezier(0.22, 0.7, 0.2, 1) both;
        }

        .student-intro-backdrop {
            position: absolute;
            inset: -8% -5% 0;
            background:
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.8), rgba(255,255,255,0) 52%),
                radial-gradient(circle at 50% 86%, color-mix(in srgb, var(--intro-accent) 28%, transparent), rgba(255,255,255,0) 64%),
                linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            pointer-events: none;
        }

        .student-intro-beam {
            position: absolute;
            top: -18%;
            width: 30%;
            height: 144%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
            filter: blur(1px);
            opacity: 0.22;
            transform: skewY(-7deg);
            animation: introBeamSweep 6.2s ease-in-out infinite;
            pointer-events: none;
        }

        .student-intro-beam-left {
            left: 16%;
            animation-delay: 0.2s;
        }

        .student-intro-beam-right {
            right: 14%;
            animation-delay: 1.1s;
        }

        .student-intro-rank-seq {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 24;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: introRankCenterToTop 7.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .student-intro-rank-seq::before,
        .student-intro-rank-seq::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(62vw, 560px);
            aspect-ratio: 1;
            border-radius: 999px;
            border: 2px solid color-mix(in srgb, var(--intro-accent) 36%, rgba(255,255,255,0.55));
            animation: introRingPulse 2.7s ease-out infinite;
            pointer-events: none;
        }

        .student-intro-rank-seq::after {
            animation-delay: 1.15s;
        }

        .student-intro-rank-label {
            font-family: var(--font-serif);
            font-size: clamp(30px, 4.3vw, 56px);
            font-weight: 700;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: rgba(28,27,25,0.82);
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 14px rgba(255,255,255,0.5);
        }

        .student-intro-rank-number {
            font-family: var(--font-display);
            font-size: clamp(190px, 23vw, 360px);
            line-height: 0.84;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: rgba(28,27,25,0.96);
            text-shadow: 0 10px 34px rgba(0,0,0,0.2), 0 0 32px color-mix(in srgb, var(--intro-accent) 28%, transparent);
            animation: celebratePop 3s ease-in-out infinite;
        }

        .student-intro-rank-top-fixed {
            position: absolute;
            left: 50%;
            top: 10px;
            z-index: 26;
            transform: translateX(-50%);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 16px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.52);
            background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(248,243,234,0.64));
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            animation: introTopRankReveal 7.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .student-intro-rank-top-fixed .student-intro-rank-label {
            margin-bottom: 0;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-shadow: none;
        }

        .student-intro-rank-top-fixed .student-intro-rank-number {
            font-size: 44px;
            line-height: 0.9;
            text-shadow: none;
            animation: none;
        }

        .student-intro-main {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 78px 34px 20px;
            display: grid;
            grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);
            align-items: center;
            column-gap: clamp(22px, 5vw, 74px);
        }

        .student-intro-photo-wrap {
            position: relative;
            width: min(42vw, 400px);
            height: min(62vh, 500px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: introPhotoReveal 7.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .student-intro-photo-glow {
            position: absolute;
            inset: 0;
            border-radius: 32px;
            filter: blur(24px);
            opacity: 0.42;
            animation: backdropPulse 6.5s ease-in-out infinite;
        }

        .student-intro-photo-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.58);
            background: linear-gradient(160deg, rgba(22,22,28,0.95), rgba(45,45,52,0.88));
            box-shadow: 0 22px 42px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .student-intro-photo-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 26%, rgba(255,255,255,0.24) 50%, transparent 74%);
            transform: translateX(-130%);
            animation: suspenseSweep 5.8s linear infinite;
            pointer-events: none;
        }

        .student-intro-photo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.03);
        }

        .student-intro-name-tag {
            position: relative;
            z-index: 14;
            width: 100%;
            max-width: min(100%, 760px);
            text-align: left;
            font-family: var(--font-display);
            font-size: clamp(38px, 6.2vw, 112px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: 0.03em;
            color: rgba(30,29,27,0.95);
            text-transform: uppercase;
            text-wrap: balance;
            overflow-wrap: break-word;
            text-shadow: 0 12px 30px rgba(255,255,255,0.36), 0 20px 46px rgba(0,0,0,0.17);
            opacity: 0;
            animation: introNameHeroReveal 7.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .student-intro-name-tag::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -18px;
            width: min(240px, 42%);
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, color-mix(in srgb, var(--intro-accent) 56%, #ffffff), rgba(255,255,255,0));
            opacity: 0.72;
        }

        .student-intro-spark {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            box-shadow: 0 0 0 5px rgba(255,255,255,0.16);
            animation: introSparkOrbit 3.2s ease-in-out infinite;
            opacity: 0.45;
            pointer-events: none;
        }

        @media (max-width: 1100px) {
            .student-intro-main {
                grid-template-columns: 1fr;
                justify-items: center;
                row-gap: 24px;
                padding-top: 96px;
            }

            .student-intro-name-tag {
                text-align: center;
                max-width: 100%;
                font-size: clamp(42px, 9.4vw, 92px);
            }

            .student-intro-name-tag::after {
                left: 50%;
                transform: translateX(-50%);
                width: 200px;
            }
        }

        .pulse-node {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>

            const tried = (img.dataset.tried || '').split(',').filter(Boolean);

            for (const fallbackVariant of fallbackOrder) {
                if (!tried.includes(fallbackVariant)) {
                    tried.push(fallbackVariant);
                    img.dataset.tried = tried.join(',');
                    img.src = getPhotoPath(rank, fallbackVariant);
                    return;

            img.onerror = null;

        function clearAchievementCycle() {
            if (achievementCycleTimer) {
                clearInterval(achievementCycleTimer);
                achievementCycleTimer = null;
            }
        }

        function getAchievementIconMeta(index) {
            if (index === 0) return { icon: 'fa-trophy', color: '#D97706' };
            if (index === 1) return { icon: 'fa-star', color: '#CA8A04' };
            return { icon: 'fa-award', color: '#2563EB' };
        }

        function initAchievementTicker(slide, viewportEl) {
            clearAchievementCycle();
            if (!slide || slide.type !== 'student-achievements' || !slide.student || !viewportEl) return;

            const achievements = (slide.student.achievements || []).filter(Boolean);
            if (!achievements.length) return;

            const textEl = viewportEl.querySelector('.achievement-rotator-text');
            const iconEl = viewportEl.querySelector('.achievement-rotator-icon');
            const indexEl = viewportEl.querySelector('.achievement-rotator-index');
            const totalEl = viewportEl.querySelector('.achievement-rotator-total');

            if (!textEl) return;

            let idx = 0;

            const render = () => {
                const current = achievements[idx];
                const iconMeta = getAchievementIconMeta(idx);

                textEl.textContent = current;
                if (iconEl) {
                    iconEl.className = `fa-solid ${iconMeta.icon} achievement-rotator-icon`;
                    iconEl.style.color = iconMeta.color;
                }
                if (indexEl) indexEl.textContent = String(idx + 1);
                if (totalEl) totalEl.textContent = String(achievements.length);
            };

            render();

            if (achievements.length > 1) {
                achievementCycleTimer = setInterval(() => {
                    idx = (idx + 1) % achievements.length;
                    render();
                }, 3200);
            }
        }

        function applyUniversalSlideAnimations(viewportEl) {
            if (!viewportEl) return;

            const selector = [
                'h1',
                'h2',
                'h3',
                'p',
                'li',
                '.photo-wrap',
                '.washi-tape',
                '.network-thumb',
                'div[class*="rounded"]'
            ].join(',');

            const targets = Array.from(viewportEl.querySelectorAll(selector)).slice(0, 28);
            targets.forEach((el, index) => {
                if (el.classList.contains('slide-item-enter')) return;
                el.classList.add('slide-item-enter');
                el.style.setProperty('--enter-delay', `${Math.min(index * 0.06, 0.9)}s`);
            });
        }

            if (slide.type === 'outro') {
                return `
                    <div class="h-full w-full flex flex-col justify-center items-center text-center px-12 relative overflow-hidden">
                        <div class="absolute -top-12 left-14 w-56 h-56 rounded-full bg-[#FFD166]/24 blur-3xl outro-glow"></div>
                        <div class="absolute -bottom-16 right-10 w-64 h-64 rounded-full bg-[#A8DADC]/24 blur-3xl outro-glow" style="animation-delay:1.2s;"></div>
                        <h1 class="font-display-journal text-[116px] font-black text-[#2C2A29] leading-none mb-7 uppercase title-pulse content-rise">Terima Kasih</h1>
                        <p class="text-[40px] font-semibold text-black/80 max-w-5xl leading-tight content-rise" style="animation-delay:0.12s;">

            return slide.render();
        }

        function renderPresentationView() {
            const root = document.getElementById('app-root');
            root.className = "min-h-screen flex items-center justify-center overflow-hidden w-full bg-[#0d0d11]";
            
            root.innerHTML = `
                <div id="presentation-container" class="relative overflow-hidden rounded-2xl shadow-2xl transition-all duration-300">
                    <div id="canvas" class="paper-texture relative flex flex-col justify-between p-12 overflow-hidden select-none w-[1280px] h-[720px] transition-colors duration-700">
                        
                        <!-- Header Proyektor -->
                        <div class="flex justify-between items-center w-full relative z-10 ${highReadabilityMode ? 'hidden' : ''}">
                            <div class="flex items-center gap-3">
                                <span class="w-2.5 h-2.5 rounded-full bg-black/20" id="live-indicator"></span>
                                <span class="font-sans text-[10px] tracking-[0.25em] text-black/40 font-extrabold uppercase">PELEPASAN MTsN 1 MALUKU TENGAH</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-sans text-[10px] text-black/30 font-bold tracking-widest uppercase">MATAWARU 2026</span>
                            </div>
                        </div>

                        <!-- Area Konten Slide Aktif -->
                        <div class="relative z-10 flex-grow flex items-center w-full ${highReadabilityMode ? 'h-full' : 'h-[500px]'}" id="slide-viewport">
                            <!-- Diisi lewat fungsi JS -->
                        </div>

                        <!-- Footer Proyektor -->
                        <div class="flex justify-between items-center w-full pt-4 border-t border-black/5 relative z-10 ${highReadabilityMode ? 'hidden' : ''}">
                            <span id="slide-counter" class="font-sans text-[10px] text-black/30 tracking-[0.2em] font-extrabold">SLIDE -- / --</span>
                            <span class="font-sans text-[9px] text-black/20 tracking-wider font-semibold">TAMPILAN LAYAR UTAMA (16:9)</span>
                        </div>

                    </div>
                </div>
            `;

            buildSlides();
            displaySlide(currentSlideIndex);
            handleAspectResize();
            
            window.addEventListener('resize', handleAspectResize);

            // Penerima PostMessage dari operator
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SYNC_SLIDE_TO_PROYECTOR') {
                    displaySlide(event.data.index);
                }
            });

            // Mengirim kabar balik ke Operator
            if (window.opener) {
                try {
                    window.opener.postMessage({ type: 'PROYECTOR_READY' }, '*');
                } catch (e) {
                    console.warn(e);
                }
            }
        }

        function handleAspectResize() {
            const container = document.getElementById('presentation-container');
            if (!container) return;
            const targetWidth = 1280;
            const targetHeight = 720;

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            let scale = Math.min(windowWidth / targetWidth, windowHeight / targetHeight);
            
            container.style.width = `${targetWidth}px`;
            container.style.height = `${targetHeight}px`;
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
            
            container.parentElement.style.height = `${targetHeight * scale}px`;
            container.parentElement.style.width = `${targetWidth * scale}px`;
        }

        function displaySlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentSlideIndex = index;
            const slide = slides[index];
            clearAchievementCycle();

            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('slide-viewport');
            const counter = document.getElementById('slide-counter');
            const liveIndicator = document.getElementById('live-indicator');

            if (!canvas || !viewport) return;

            // Transisi Background Shifting Gradual
            if (slide.bgColor) {
                canvas.style.backgroundColor = slide.bgColor;
                canvas.classList.remove('paper-texture');
                // Beri efek redup jika gelap
                if (slide.bgColor === '#0F0E14') {
                    canvas.classList.add('bg-opacity-100');
                    liveIndicator.style.backgroundColor = 'rgba(255,255,255,0.2)';
                } else {
                    liveIndicator.style.backgroundColor = 'rgba(0,0,0,0.2)';
                }
            } else {
                canvas.style.backgroundColor = 'var(--paper-color)';
                canvas.classList.add('paper-texture');
            }

            // Ganti Konten dengan animasi
            const slideMarkup = highReadabilityMode ? renderReadableSlide(slide) : slide.render();

            viewport.innerHTML = `
                <div class="w-full h-full slide-fade-enter slide-motion" id="slide-transition-box">
                    ${slideMarkup}
                </div>
            `;

            setTimeout(() => {
                const box = document.getElementById('slide-transition-box');
                if (box) box.classList.add('slide-fade-active');
            }, 50);

            applyUniversalSlideAnimations(viewport);
            initAchievementTicker(slide, viewport);

            if (counter) {
                counter.innerText = `SLIDE ${(index + 1).toString().padStart(2, '0')} / ${slides.length.toString().padStart(2, '0')}`;
            }

            // Beri tahu operator perubahan indeks manual di layar proyektor
            if (window.opener) {
                try {
                    window.opener.postMessage({ type: 'SLIDE_CHANGED_REMOTE', index: index }, '*');
                } catch (e) {
                    console.warn(e);
                }
            }
        }
    </script>

    <script>

                            </h1>

                                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                                Proyektor Terputus
                            </div>

                                <i class="fa-solid fa-desktop"></i>

                                <h2 id="operator-slide-title" class="text-2xl font-black text-white mt-2 font-display-journal truncate">Memuat...</h2>

                                <span id="operator-slide-type" class="text-[9px] px-2 py-0.5 rounded bg-white/5 text-white/50 border border-white/10 font-bold uppercase tracking-wider">---</span>

                        <!-- Kendali Utama Panggung -->
                        <div class="bg-white/5 border border-white/10 rounded-xl p-5 md:col-span-2 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] text-white/40 uppercase tracking-widest block font-bold">Navigasi Panggung</span>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
                                    <button onclick="sendPrevSlide()" class="h-12 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white font-bold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                                        <i class="fa-solid fa-chevron-left"></i> SEBELUMNYA

                                        BERIKUTNYA <i class="fa-solid fa-chevron-right"></i>

                                    <button onclick="sendCover()" class="h-12 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white font-bold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all">

                                <span class="bg-white/5 px-2 py-1 rounded">Kiri: Slide Mundur</span>
                            </div>
                        </div>

                        <!-- Autoplay Adaptif (Loop Slide 3 - 32) -->
                        <div class="bg-white/5 border border-white/10 rounded-xl p-5 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] text-white/40 uppercase tracking-widest block font-bold">Autoplay Loop (Semua Slide Siswa)</span>
                                <button id="autoplay-btn" onclick="toggleAutoPlay()" class="w-full h-11 mt-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all">
                                    <i class="fa-solid fa-play"></i> AKTIFKAN AUTOPLAY
                                </button>
                            </div>
                            <div id="autoplay-indicator" class="mt-2 hidden">
                                <div class="flex justify-between text-[10px] text-white/50 mb-1 font-semibold uppercase tracking-wider">
                                    <span id="autoplay-countdown">Menunggu...</span>
                                </div>
                                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden border border-white/5">
                                    <div id="autoplay-progress" class="h-full bg-gradient-to-r from-pink-500 to-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.5)] transition-all duration-1000 ease-linear" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="text-[9px] text-white/40 leading-relaxed mt-1">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i> Waktu Baca: Intro Siswa (5d), Identitas (6d), Prestasi (otomatis dinamis), Harapan (8d).
                            </div>
                        </div>
                    </div>

                    <!-- Lompat Cepat Per Peringkat -->
                    <div>
                        <span class="text-xs font-semibold text-white/60 uppercase tracking-wider block mb-3">Lompat Ke Peringkat Tertentu:</span>
                        <div id="student-quick-links" class="flex flex-wrap gap-2">
                            <!-- Disuntikkan lewat JS -->
                        </div>
                    </div>

                    <!-- Linimasa Linier Slide -->
                    <div>
                        <span class="text-xs font-semibold text-white/60 uppercase tracking-wider block mb-3">Linimasa Semua Slide:</span>
                        <div id="slide-timeline-selector" class="flex gap-3 overflow-x-auto pb-3 select-none no-scrollbar">
                            <!-- Disuntikkan lewat JS -->
                        </div>
                    </div>

                </div>
            `;

            buildSlides();
            renderOperatorUIElements();
            updateOperatorUI();

            // Dengarkan kabar balik dari Proyektor
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'PROYECTOR_READY') {
                    updateConnectionStatus(true);
                    syncToPresentation();
                }
                if (event.data && event.data.type === 'SLIDE_CHANGED_REMOTE') {
                    currentSlideIndex = event.data.index;
                    updateOperatorUI();
                }
            });
        }

        function openPresentationWindow() {
            const separator = window.location.href.includes('?') ? '&' : '?';
            const targetUrl = window.location.href + separator + "mode=presentation";
            
            presWindow = window.open(targetUrl, 'MatawaruPresentationWindow', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
            
            if (presWindow) {
                updateConnectionStatus(true);
                setTimeout(() => {
                    syncToPresentation();
                }, 1000);
            } else {
                // Gunakan kotak pesan terintegrasi di UI untuk menggantikan alert()
                const statusIndicator = document.getElementById('connection-status');
                statusIndicator.innerText = "Izinkan Pop-Up Browser!";
            }
        }

        function updateConnectionStatus(isConnected) {
            const statusIndicator = document.getElementById('connection-status');
            if (!statusIndicator) return;
            if (isConnected) {
                statusIndicator.className = "flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 text-xs font-bold rounded-lg uppercase tracking-wider";
                statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Proyektor Terhubung`;
            } else {
                statusIndicator.className = "flex items-center gap-2 px-3 py-1.5 bg-red-500/10 border border-red-500/30 text-red-500 text-xs font-bold rounded-lg uppercase tracking-wider";
                statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> Proyektor Terputus`;
            }
        }

        function syncToPresentation() {
            let connected = false;
            try {
                if (presWindow && !presWindow.closed) {
                    presWindow.postMessage({ type: 'SYNC_SLIDE_TO_PROYECTOR', index: currentSlideIndex }, '*');
                    connected = true;
                }
            } catch (err) {
                console.warn(err);
            }
            updateConnectionStatus(connected);
            updateOperatorUI();

            if (isAutoPlay) {
                startAutoPlayTimer();
            }
        }

        function renderOperatorUIElements() {
            const quickLinks = document.getElementById('student-quick-links');
            const timeline = document.getElementById('slide-timeline-selector');

            if (!quickLinks || !timeline) return;

            quickLinks.innerHTML = '';
            timeline.innerHTML = '';

            // Render pintasan siswa 10 ke 1
            studentsOrdered.forEach(student => {
                const btn = document.createElement('button');
                btn.className = "px-3 py-2 border rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center gap-2 border-white/10 text-white/80 bg-white/5 hover:bg-white/10";
                
                // Set warna aksen border berdasarkan warna khas
                btn.style.borderColor = `${student.themeColor}40`;
                btn.style.color = student.themeColor;

                btn.innerHTML = `<span>R0${student.rank}</span> <span class="text-white/20">|</span> <span class="text-white font-medium truncate max-w-[100px]">${student.name.split(' ')[0]}</span>`;
                
                // Menghitung indeks awal slide siswa (setelah Cover & Intro)
                const studentIndexInSlides = slides.findIndex(
                    s => s.type === 'student-intro' && s.student && s.student.rank === student.rank
                );
                btn.onclick = () => jumpToSlide(studentIndexInSlides >= 0 ? studentIndexInSlides : 2);
                quickLinks.appendChild(btn);
            });

            // Render timeline linier lengkap
            slides.forEach((slide, i) => {
                const card = document.createElement('button');
                card.id = `timeline-card-${i}`;
                card.className = "flex-shrink-0 w-28 h-16 rounded-xl border flex flex-col justify-between p-2.5 text-left cursor-pointer transition-all duration-200 select-none bg-[#111018] border-white/5 text-white/40 hover:border-white/15";
                
                let title = "Sampul";
                let badge = `S-${i+1}`;
                
                if (slide.type === 'student-intro') {
                    title = `R${slide.student.rank} Intro`;
                } else if (slide.type === 'student-identity') {
                    title = `R${slide.student.rank} Profil`;
                } else if (slide.type === 'student-achievements') {
                    title = `R${slide.student.rank} Prestasi`;
                } else if (slide.type === 'student-future') {
                    title = `R${slide.student.rank} Karir`;
                } else if (slide.type === 'intro') {
                    title = "Arahan";
                } else if (slide.type === 'networking') {
                    title = "Jejaring";
                } else if (slide.type === 'outro') {
                    title = "Penutup";
                }
                
                card.innerHTML = `
                    <span class="text-[9px] uppercase font-bold tracking-wider truncate w-full block">${title}</span>
                    <span class="text-[9px] text-white/30 font-sans">${badge}</span>
                `;
                card.onclick = () => jumpToSlide(i);
                timeline.appendChild(card);
            });
        }

        function jumpToSlide(index) {
            currentSlideIndex = index;
            syncToPresentation();
        }

        function updateOperatorUI() {
            if (slides.length === 0) return;
            const slide = slides[currentSlideIndex];

            const titleEl = document.getElementById('operator-slide-title');
            const descEl = document.getElementById('operator-slide-desc');
            const indexEl = document.getElementById('operator-slide-index');
            const typeEl = document.getElementById('operator-slide-type');

            if (!titleEl || !descEl) return;

            if (slide.type === 'cover') {
                titleEl.innerText = "Sampul Utama";
                descEl.innerText = "Tampilan pembuka visual MATAWARU Pelepasan 2026.";
                typeEl.innerText = "Cover";
            } else if (slide.type === 'intro') {
                titleEl.innerText = "Pengantar Misi";
                descEl.innerText = "Penyampaian esensi filosofis dari prinsip kepemimpinan MATAWARU.";
                typeEl.innerText = "Intro";
            } else if (slide.type.startsWith('student-')) {
                titleEl.innerText = slide.student.name;
                const stage = slide.type === 'student-intro'
                    ? 'Pengantar Siswa'
                    : (slide.type === 'student-identity'
                        ? 'Profil & Ortu'
                        : (slide.type === 'student-achievements' ? 'Awan Prestasi' : 'Cita-Cita & Harapan'));
                descEl.innerText = `Menampilkan ${stage} dari nominasi terbaik Peringkat ${slide.student.rank}.`;
                typeEl.innerText = `S-${slide.student.rank}`;
            } else if (slide.type === 'networking') {
                titleEl.innerText = "Jejaring Matawaru";
                descEl.innerText = "Peta visual rasi bintang keterhubungan 10 besar lulusan terbaik.";
                typeEl.innerText = "Network";
            } else if (slide.type === 'outro') {
                titleEl.innerText = "Ucapan Penutup";
                descEl.innerText = "Doa pelepasan luhur dan ucapan terima kasih akhir.";
                typeEl.innerText = "Closing";
            }

            indexEl.innerText = `SLIDE ${(currentSlideIndex + 1).toString().padStart(2, '0')} / ${slides.length.toString().padStart(2, '0')}`;

            // Soroti kartu aktif di timeline
            document.querySelectorAll('[id^="timeline-card-"]').forEach(card => {
                card.classList.remove('border-pink-500', 'bg-pink-500/10', 'text-white', 'shadow-[0_0_10px_rgba(224,33,138,0.15)]');
                card.classList.add('border-white/5', 'text-white/40');
            });

            const activeCard = document.getElementById(`timeline-card-${currentSlideIndex}`);
            if (activeCard) {
                activeCard.classList.remove('border-white/5', 'text-white/40');
                activeCard.classList.add('border-pink-500', 'bg-pink-500/10', 'text-white', 'shadow-[0_0_10px_rgba(224,33,138,0.15)]');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // KENDALI PENYIMPANAN WAKTU DAN AUTOPLAY LOOP
        function getSlideDuration(index) {
            const slide = slides[index];
            if (!slide) return 8;
            if (slide.type === 'cover' || slide.type === 'intro' || slide.type === 'networking' || slide.type === 'outro') {
                return 8; 
            }
            if (slide.type === 'student-intro') return 8; // Urutan rank besar -> top center -> foto kiri -> nama kanan
            if (slide.type === 'student-identity') return 6; // Pengenalan nama & ortu: 6d
            if (slide.type === 'student-achievements') {
                const achievementCount = slide.student?.achievements?.length || 1;
                // 1 prestasi tampil per 3.2 detik, beri buffer agar transisi tetap nyaman.
                return Math.max(10, Math.min(22, Math.ceil(achievementCount * 3.2) + 2));
            }
            if (slide.type === 'student-future') return 8; // Membaca cita-cita & impian: 8d
            return 8;
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            const btn = document.getElementById('autoplay-btn');
            const indicator = document.getElementById('autoplay-indicator');

            if (!btn || !indicator) return;
            
            if (isAutoPlay) {
                btn.innerHTML = `<i class="fa-solid fa-pause"></i> PAUSE AUTOPLAY`;
                btn.className = "w-full h-11 mt-3 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-xl font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all shadow-[0_0_10px_rgba(245,158,11,0.15)]";
                indicator.classList.remove('hidden');
                startAutoPlayTimer();
            } else {
                btn.innerHTML = `<i class="fa-solid fa-play"></i> AKTIFKAN AUTOPLAY`;
                btn.className = "w-full h-11 mt-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all";
                indicator.classList.add('hidden');
                clearAutoPlayTimers();
            }
        }

        function clearAutoPlayTimers() {
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            if (countdownTimer) clearInterval(countdownTimer);
        }

        function startAutoPlayTimer() {
            clearAutoPlayTimers();
            if (!isAutoPlay) return;

            const duration = getSlideDuration(currentSlideIndex);
            countdownValue = duration;
            updateCountdownUI();

            countdownTimer = setInterval(() => {
                countdownValue--;
                updateCountdownUI();
                if (countdownValue <= 0) {
                    clearInterval(countdownTimer);
                }
            }, 1000);

            autoPlayTimer = setTimeout(() => {
                advanceSlideAuto();
            }, duration * 1000);
        }

        function updateCountdownUI() {
            const label = document.getElementById('autoplay-countdown');
            const progress = document.getElementById('autoplay-progress');
            if (label) {
                label.innerText = `Lanjut Otomatis Dalam ${countdownValue} Detik...`;
            }
            if (progress) {
                const totalDuration = getSlideDuration(currentSlideIndex);
                const percent = (countdownValue / totalDuration) * 100;
                progress.style.width = `${percent}%`;
            }
        }

        function advanceSlideAuto() {
            if (!isAutoPlay) return;

            const firstStudentIndex = slides.findIndex(s => s.type && s.type.startsWith('student-'));
            const lastStudentIndex = (() => {
                for (let i = slides.length - 1; i >= 0; i--) {
                    if (slides[i].type && slides[i].type.startsWith('student-')) return i;
                }
                return firstStudentIndex;
            })();

            if (firstStudentIndex < 0 || lastStudentIndex < 0) return;

            // Loop Autoplay dikunci pada semua slide siswa.
            if (currentSlideIndex < firstStudentIndex || currentSlideIndex >= lastStudentIndex) {
                currentSlideIndex = firstStudentIndex;
            } else {
                currentSlideIndex++;
            }
            syncToPresentation();
        }

        function sendNextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                syncToPresentation();
            }
        }

        function sendPrevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                syncToPresentation();
            }
        }

        function sendCover() {
            currentSlideIndex = 0;
            syncToPresentation();
        }

        function sendOutro() {
            currentSlideIndex = slides.length - 1;
            syncToPresentation();
        }
    </script>

    <script>
        // Keyboard global controller
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.code === 'Space') {
                e.preventDefault();
                sendNextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                sendPrevSlide();
            }
        });

        // Deteksi mode muat dari query param
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const isPresentationMode = urlParams.get('mode') === 'presentation';

            if (isPresentationMode) {
                renderPresentationView();
            } else {
                renderOperatorView();
            }
        };

        window.onbeforeunload = function() {
            if (presWindow && !presWindow.closed) {
                presWindow.close();
            }
        };
    </script>

</body>
